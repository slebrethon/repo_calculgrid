<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=430, initial-scale=1.0" />
    <title>page GRID</title>
    <!-- appel CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game-container">
      <div class="top-bar">
        <div class="target-box" id="target"></div>
        <button id="pauseBtn" data-i18n="game_pause"></button>
        <button
          id="toolsBtn"
          data-i18n="game_params"
          onclick="goToParams()"
        ></button>
      </div>
      <div class="current-sum">
        <span data-i18n="game_current_sum"> </span>
        <span id="currentSumValue"> 0 </span>
        <span class="separator"> | </span>
        <span data-i18n="game_score"> </span>
        <span id="scoreValue"> 0 </span>
        <span class="separator"> | </span>
        <span data-i18n="game_level"> </span>
        <span id="levelValue"> 0 </span>
      </div>
      <div class="time-container">
        <div class="time-bar" id="timeBar"></div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="buttons">
        <button id="refresh" data-i18n="game_refresh"></button>
        <button id="reset" data-i18n="game_reset"></button>
        <button id="quit" data-i18n="game_quit"></button>
      </div>
    </div>

    <!-- modal FIN DE JEU -->
    <div class="modal fade" id="gameOverModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="game_overtitle"></h5>
          </div>
          <div class="modal-body text-center">
            <p data-i18n="game_overtext"></p>
          </div>
          <div class="modal-footer d-flex flex-column gap-2">
            <button
              class="btn btn-success w-100"
              onclick="restartGame()"
              data-i18n="game_restart"
            ></button>
            <button
              class="btn btn-danger w-100"
              onclick="goToMenu()"
              data-i18n="game_quit"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <!-- appel SON -->
    <audio
      id="tapSound"
      src="assets/sound/sound_tap.mp3"
      preload="auto"
    ></audio>
    <audio
      id="errorSound"
      src="assets/sound/sound_error.mp3"
      preload="auto"
    ></audio>
    <audio
      id="winSound"
      src="assets/sound/sound_win.mp3"
      preload="auto"
    ></audio>
    <audio
      id="levelupSound"
      src="assets/sound/sound_levelup.mp3"
      preload="auto"
    ></audio>
    <audio
      id="clockSound"
      src="assets/sound/sound_clock.mp3"
      preload="auto"
    ></audio>
    <audio
      id="musicAmbiance"
      src="assets/sound/music_ambiance.mp3"
      preload="auto"
    ></audio>
    <!-- appel JS-GLOBAL -->
    <script src="scripts/js_include.js"></script>
  </body>
</html>
